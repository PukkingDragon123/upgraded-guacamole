<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>FISHTOP</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1622; }
  body.transparent { background: transparent; }
  #screen {
    position: fixed; left: 0; top: 0;
    image-rendering: pixelated; image-rendering: crisp-edges;
    cursor: none; touch-action: none; outline: none;
  }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #7fd6c8; font: 12px monospace; }
</style>
</head>
<body>
<canvas id="screen" tabindex="0"></canvas>
<div id="boot">loading FISHTOP...</div>
<script src="fishtop.js"></script>
</body>
</html>
